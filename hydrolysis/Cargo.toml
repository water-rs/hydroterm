[package]
name = "hydroterm-hydrolysis-b3e8833b"
version = "0.1.0"
edition = "2024"
autobins = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
]

[lib]
name = "hydroterm_hydrolysis_b3e8833b_lib"
crate-type = [
    "cdylib",
    "rlib",
]

[[bin]]
name = "hydroterm-hydrolysis-b3e8833b"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[features]
waterui-mcp-mode = [
    "dep:waterui-mcp",
    "dep:waterui-testing",
]
waterui-preview-mode = ["dep:waterui-preview"]
waterui-preview-test-mode = ["dep:waterui-testing"]

[dependencies.hydroterm]
path = ".."

[dependencies.waterui]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
serde = "1"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hydrolysis]
git = "https://github.com/water-rs/hydrolysis"
rev = "06f0b2fafbd0e0fb722cacf993d56cd87f661666"
default-features = false
features = ["winit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hydrolysis-m3]
git = "https://github.com/water-rs/hydrolysis-m3"
rev = "f4fbd90c91a45dd8149b790e841ed84ec252761d"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-core]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-mcp]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-preview]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-preview-protocol]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-testing]
git = "https://github.com/water-rs/waterui"
rev = "9dfe6bef45d7e33c358161cbcb5af47a56640dcf"
default-features = false
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.hydrolysis]
git = "https://github.com/water-rs/hydrolysis"
rev = "06f0b2fafbd0e0fb722cacf993d56cd87f661666"
default-features = false
features = ["web"]

[target.'cfg(target_arch = "wasm32")'.dependencies.hydrolysis-m3]
git = "https://github.com/water-rs/hydrolysis-m3"
rev = "f4fbd90c91a45dd8149b790e841ed84ec252761d"
default-features = false

