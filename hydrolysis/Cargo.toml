[package]
name = "hydroterm-hydrolysis-b3e8833b"
version = "0.1.0"
edition = "2024"
autobins = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
]

[lib]
name = "hydroterm_hydrolysis_b3e8833b_lib"
crate-type = [
    "cdylib",
    "rlib",
]

[[bin]]
name = "hydroterm-hydrolysis-b3e8833b"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[features]
waterui-mcp-mode = ["dep:waterui-mcp"]
waterui-preview-mode = []
waterui-preview-test-mode = []

[dependencies.hydroterm]
path = ".."

[dependencies.waterui]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
serde = "1"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hydrolysis]
git = "https://github.com/water-rs/hydrolysis"
rev = "926424bc7f501863c51c9028c8d735bfcb0cdc7d"
default-features = false
features = ["winit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hydrolysis-m3]
git = "https://github.com/water-rs/hydrolysis-m3"
rev = "631ba9d656c23280138eb272e11104fed40dce11"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-core]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-mcp]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-preview]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-preview-protocol]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.waterui-testing]
git = "https://github.com/water-rs/waterui"
rev = "9971190d7305bff27db2efef17c664bafc365b6c"
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.hydrolysis]
git = "https://github.com/water-rs/hydrolysis"
rev = "926424bc7f501863c51c9028c8d735bfcb0cdc7d"
default-features = false
features = ["web"]

[target.'cfg(target_arch = "wasm32")'.dependencies.hydrolysis-m3]
git = "https://github.com/water-rs/hydrolysis-m3"
rev = "631ba9d656c23280138eb272e11104fed40dce11"
default-features = false

