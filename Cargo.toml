waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "a3e2818c807081cad1bf96cb541ef42b0110a2c9" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "a3e2818c807081cad1bf96cb541ef42b0110a2c9" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "a3e2818c807081cad1bf96cb541ef42b0110a2c9" }
