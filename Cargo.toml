[package]
name = "hydroterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A modern GPU terminal emulator built on WaterUI's hydrolysis backend"

[dependencies]
waterui = { default-features = false, features = ["gpu", "snackbar"] , git = "https://github.com/water-rs/waterui", rev = "3b3d31a7b4444d0246f3604377bb6d92b9b29d07" }
waterui-graphics = { version = "0.5.1", default-features = false }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "3b3d31a7b4444d0246f3604377bb6d92b9b29d07" }
waterui-text = { version = "0.5.1", features = ["font-collection"] }
hydrolysis = { version = "0.3.1", features = ["winit"] }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "cc8be840d96be39dc6f23aeace7310801d7a5f35" }
nami = "=0.11.1"
alacritty_terminal = "0.26.0"
waterkit-clipboard = "0.1.4"
waterkit-notification = "0.1.4"
parley = { version = "0.11", default-features = false, features = ["system"] }
keyboard-types = "0.8"
async-channel = "2.5"
# X11 global hotkey for the quick terminal (already in the tree via winit).
x11rb = { version = "0.13", features = ["xfixes"] }
pollster = "1.0"
libc = "0.2"
png = "0.17"
# `link = <regex>` config patterns — already in the framework lock at 1.13.
regex = "1.11"
tracing = "0.1"
polling = "3.8.0"
rustix = { version = "1.1.5", features = ["shm", "fs"] }

[dev-dependencies]
base64 = "0.22.1"

[build-dependencies]
cfg_aliases = "0.2.2"

[features]
# The `water` CLI's dev loop links the app as a dylib against a shared
# framework copy (`water run`/`preview` build strategy, not a capability).
dev = ["waterui/dynamic_linking"]

[profile.release]
lto = "thin"
codegen-units = 1

# The reader-thread pipeline (PTY read -> OSC scan -> VT parse -> grid)
# is the bulk-output bottleneck: at opt-level 0 the whole loop feeds only
# ~11 MB/s (parse+grid alone ~134 MB/s optimized). Compile the dev profile
# at opt-level 2 with debuginfo kept — this is the standard practice for
# performance-sensitive dev binaries — so the terminal's measured numbers
# reflect the shipped shape rather than debug-codegen tax.
[profile.dev]
opt-level = 2

[workspace]

[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/water-rs/lints", rev = "18163a9cc7e96eb1ad3537d858dcb0502a01b7d4" },
]

# Framework pins — authored by `water channel dev` so every waterui crate in
# the graph resolves to the revisions the dev channel certifies as coherent.
# The third-party forks (cherenkov family, wgpu/naga, xcb) come along so the
# graph holds exactly one copy of each crate.
[patch.crates-io]
