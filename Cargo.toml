waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "034057120bdade53c00ce2a63c1094172d9c01a2" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "034057120bdade53c00ce2a63c1094172d9c01a2" }
