[package]
name = "hydroterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A modern GPU terminal emulator built on WaterUI's hydrolysis backend"

[dependencies]
waterui = { version = "0.5.2", default-features = false, features = ["gpu", "snackbar"] }
waterui-graphics = { version = "0.5.1", default-features = false }
waterui-core = "0.5.0"
waterui-text = { version = "0.5.1", features = ["font-collection"] }
hydrolysis = { version = "0.3.1", features = ["winit"] }
hydrolysis-m3 = "0.3.1"
nami = "=0.11.1"
alacritty_terminal = "0.26.0"
waterkit-clipboard = "0.1.4"
waterkit-notification = "0.1.4"
parley = { version = "0.11", default-features = false, features = ["system"] }
peniko = "0.6"
kurbo = "0.13"
keyboard-types = "0.8"
async-channel = "2.5"
# X11 global hotkey for the quick terminal (already in the tree via winit).
x11rb = "0.13"
pollster = "1.0"
libc = "0.2"
png = "0.17"
# `link = <regex>` config patterns — already in the framework lock at 1.13.
regex = "1.11"
tracing = "0.1"
polling = "3.8.0"

[features]
# The `water` CLI's dev loop links the app as a dylib against a shared
# framework copy (`water run`/`preview` build strategy, not a capability).
dev = ["waterui/dynamic_linking"]

[profile.release]
lto = "thin"
codegen-units = 1

# The reader-thread pipeline (PTY read -> OSC scan -> VT parse -> grid)
# is the bulk-output bottleneck: at opt-level 0 the whole loop feeds only
# ~11 MB/s (parse+grid alone ~134 MB/s optimized). Compile the dev profile
# at opt-level 2 with debuginfo kept — this is the standard practice for
# performance-sensitive dev binaries — so the terminal's measured numbers
# reflect the shipped shape rather than debug-codegen tax.
[profile.dev]
opt-level = 2

[workspace]

[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/water-rs/lints", rev = "a9058391ed6a876bea4a53c9499623eaaff82f78" },
]

# Framework pins — copied from the hydrolysis repository's own `[patch.crates-io]`
# block so every waterui crate in the graph resolves to the one revision that
# lets `SceneContent` receive input (water-rs/waterui#1189, routed by
# water-rs/hydrolysis#84). The third-party forks (vello series, xcb) come along
# so the graph holds exactly one copy of each crate.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "76292095f408cf04b901023c2053f8d424652f06" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

# `waterui-testing` depends on this backend at the 0.5.0-wave requirement
# `0.3.0`, which is this package; a registry copy would be pre-freeze code
# that no longer builds against the revision below. Drop the entry once
# hydrolysis 0.3.0 ships.
# Pinned to hydrolysis dev — #294 (fail-fast X11 placement paths, the
# water-rs/waterui#1302 placement + activation policy, launch activation
# only when a startup window asks for it) on top of #284's deferred
# vello bump verification. waterui pins ride its own [patch.crates-io]
# wave at waterui dev 8cf506ce (#1319+#1318+#1320+#1321).
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "1d616f6ea605919cb3deb9af0810a51433c87fe3" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "d8e6806ece90aa6cd2cdd578c4eb9550958b4d36" }

# water-rs/nami#26: `Signal::get` renamed to `snapshot`. Pinned to the nami dev
# rev whose manifest still reads 0.11.1; our dep is `=0.11.1` so the patched
# source wins over crates.io 0.11.2 (which still ships `get`). Drop once a
# released nami carries the rename.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# water-rs/waterkit#91: Linux `PrimarySelection` (X11 + Wayland data-control),
# replaces hydroterm's own ICCCM owner (former src/xsel.rs). All waterkit
# crates come from one dev rev so the whole graph carries the nami#26
# `Signal::snapshot` migration (crates.io waterkit-core 0.1.4 still impls
# `get`); keep pinned until a release carries it.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-notification = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }

